<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#28b6d8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Vi skal på sommerferie!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --pool:#1fc1dc;        /* poolens turkis */
    --pool-deep:#0f8fb0;
    --coral:#ff5a48;       /* First Camp / hoppepude rød */
    --coral-deep:#e23f2f;
    --sun:#ffc637;         /* solgul */
    --grass:#46c46a;       /* græs */
    --grape:#7b6cf6;       /* spillehal lilla */
    --sky:#34c6ee;
    --sky-soft:#bfeefc;
    --sand:#fff6e6;        /* tekstpanel */
    --ink:#0e3a4d;         /* mørk tekst */
    --ink-soft:#3a6173;
    --white:#ffffff;
    --display:"Baloo 2", system-ui, "Segoe UI Rounded", "Arial Rounded MT Bold", sans-serif;
    --body:"Nunito", system-ui, "Segoe UI", sans-serif;
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%;}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:linear-gradient(180deg,#19a9e6 0%, #46c8ee 38%, #9fe7f6 78%, #d7f6c2 100%);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- himmel-kulisse ---------- */
  .sky{position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;}
  .sun{
    position:absolute; top:-46px; right:-46px; width:190px; height:190px; border-radius:50%;
    background:radial-gradient(circle at 50% 50%, #fff2b0 0%, var(--sun) 58%, #ff9e2c 100%);
    box-shadow:0 0 0 22px rgba(255,198,55,.28), 0 0 0 48px rgba(255,198,55,.16);
    animation:spin 60s linear infinite;
  }
  .cloud{position:absolute; background:#fff; border-radius:60px; opacity:.92;
    filter:drop-shadow(0 10px 18px rgba(20,90,120,.12));}
  .cloud::before,.cloud::after{content:""; position:absolute; background:#fff; border-radius:50%;}
  .c1{width:120px; height:38px; top:120px; left:-140px; animation:drift 34s linear infinite;}
  .c1::before{width:54px; height:54px; top:-24px; left:20px;}
  .c1::after{width:40px; height:40px; top:-16px; left:64px;}
  .c2{width:96px; height:30px; top:240px; left:-160px; animation:drift 46s linear infinite 6s; transform:scale(.85);}
  .c2::before{width:44px; height:44px; top:-20px; left:16px;}
  .c2::after{width:34px; height:34px; top:-12px; left:52px;}
  @keyframes drift{from{transform:translateX(0);}to{transform:translateX(118vw);}}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- layout ---------- */
  #app{position:relative; z-index:1; min-height:100%; display:flex; justify-content:center;}
  .wrap{width:100%; max-width:520px; padding:22px 18px 40px; position:relative;}

  .screen{display:none; animation:popIn .5s cubic-bezier(.18,.9,.3,1.2) both;}
  .screen.active{display:block;}
  @keyframes popIn{from{opacity:0; transform:translateY(16px) scale(.97);} to{opacity:1; transform:none;}}

  /* ---------- skærm 1: overraskelse ---------- */
  .screen--surprise{min-height:84vh; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center;}
  .screen--surprise.active{display:flex;}
  .eyebrow{
    font-family:var(--display); font-weight:700; color:#fff; letter-spacing:.5px;
    background:var(--coral); padding:7px 18px; border-radius:999px; font-size:16px;
    box-shadow:0 6px 0 var(--coral-deep); margin:0 0 14px;
  }
  .big-q{
    font-family:var(--display); font-weight:800; color:#fff; line-height:1.02;
    font-size:clamp(38px,12vw,60px); margin:0 0 26px;
    text-shadow:0 4px 0 rgba(13,90,120,.35), 0 10px 22px rgba(13,90,120,.25);
  }
  .box{
    appearance:none; border:none; cursor:pointer; display:block; margin:0 auto 26px;
    width:min(74vw,260px); aspect-ratio:1/1; border-radius:34px;
    background:linear-gradient(160deg,#ff7361,var(--coral) 55%,var(--coral-deep));
    box-shadow:0 16px 0 var(--coral-deep), 0 26px 40px rgba(180,40,25,.4);
    position:relative; transition:transform .12s;
    animation:wob 2.4s ease-in-out infinite;
  }
  .box::after{content:""; position:absolute; left:50%; top:0; transform:translateX(-50%);
    width:30px; height:100%; background:rgba(255,255,255,.28);}
  .box::before{content:""; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:100%; height:30px; background:rgba(255,255,255,.28);}
  .box .qmark{position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--display); font-weight:800; font-size:clamp(80px,26vw,128px); color:#fff;
    text-shadow:0 5px 0 rgba(150,30,20,.5); z-index:2;}
  .box .bow{position:absolute; top:-22px; left:50%; transform:translateX(-50%); font-size:46px; z-index:3;}
  .box:active{transform:scale(.96) translateY(6px); box-shadow:0 8px 0 var(--coral-deep), 0 14px 24px rgba(180,40,25,.4);}
  @keyframes wob{0%,100%{transform:rotate(-2deg);}50%{transform:rotate(2deg);}}

  .cta{
    appearance:none; border:none; cursor:pointer; font-family:var(--display); font-weight:800;
    font-size:clamp(20px,5.5vw,26px); color:#fff; background:var(--grass);
    padding:16px 30px; border-radius:999px; box-shadow:0 9px 0 #2f9b50, 0 16px 28px rgba(20,120,60,.35);
    transition:transform .1s, box-shadow .1s; line-height:1;
  }
  .cta:active{transform:translateY(6px); box-shadow:0 3px 0 #2f9b50, 0 8px 16px rgba(20,120,60,.35);}
  .cta--pool{background:var(--pool); box-shadow:0 9px 0 var(--pool-deep), 0 16px 28px rgba(15,140,176,.35);}
  .cta--pool:active{box-shadow:0 3px 0 var(--pool-deep);}
  .tap-hint{margin-top:8px; font-family:var(--display); font-weight:700; color:#0d5a78; font-size:15px;}

  /* ---------- skærm 2: afsløring ---------- */
  .reveal-title{
    font-family:var(--display); font-weight:800; text-align:center; line-height:1;
    font-size:clamp(34px,10.5vw,52px); color:#fff; margin:6px 0 18px;
    text-shadow:0 4px 0 rgba(13,90,120,.35), 0 12px 22px rgba(13,90,120,.25);
  }
  .reveal-title .pop{color:var(--sun);}
  .hero-photo{
    position:relative; border-radius:28px; overflow:hidden; border:6px solid #fff;
    box-shadow:0 18px 36px rgba(13,80,110,.32); margin:0 auto 16px; aspect-ratio:3/2;
  }
  .hero-photo img{width:100%; height:100%; object-fit:cover; display:block;}
  .hero-badge{
    position:absolute; left:12px; bottom:12px; right:12px;
    font-family:var(--display); font-weight:700; color:#fff; font-size:18px;
    background:rgba(14,58,77,.62); backdrop-filter:blur(3px);
    padding:9px 14px; border-radius:16px; line-height:1.2;
  }
  .place{
    text-align:center; font-family:var(--body); font-weight:700; font-size:clamp(17px,4.6vw,21px);
    color:var(--ink); background:var(--sand); border-radius:20px; padding:14px 18px;
    margin:0 0 16px; box-shadow:0 8px 0 #f0dfbc;
  }
  .place b{color:var(--coral-deep);}
  .countdown{
    text-align:center; background:linear-gradient(160deg,#fff,#eafaff);
    border-radius:26px; padding:18px 16px 20px; margin:0 0 20px;
    box-shadow:0 10px 0 #cfeefa, 0 20px 32px rgba(13,80,110,.18); border:4px solid #fff;
  }
  .cd-num{font-family:var(--display); font-weight:800; font-size:clamp(64px,22vw,104px);
    color:var(--coral); line-height:.9; text-shadow:0 5px 0 #ffd7cf;}
  .cd-label{font-family:var(--display); font-weight:800; letter-spacing:3px; color:var(--pool-deep);
    font-size:20px; margin-top:2px;}
  .cd-text{font-family:var(--body); font-weight:800; color:var(--ink-soft); font-size:17px; margin-top:8px;}
  .center{text-align:center;}

  /* ---------- skærm 3: aktiviteter ---------- */
  .acts-title{
    font-family:var(--display); font-weight:800; text-align:center; color:#fff;
    font-size:clamp(28px,8vw,40px); margin:4px 0 18px;
    text-shadow:0 4px 0 rgba(13,90,120,.35), 0 10px 18px rgba(13,90,120,.25);
  }
  .cards{display:flex; flex-direction:column; gap:18px;}
  .card{
    appearance:none; border:none; cursor:pointer; text-align:left; width:100%;
    border-radius:26px; overflow:hidden; background:#fff; padding:0;
    box-shadow:0 12px 0 rgba(0,0,0,.10), 0 20px 30px rgba(13,80,110,.18);
    transition:transform .12s; display:block;
  }
  .card:active{transform:scale(.985) translateY(3px);}
  .card-img{position:relative; aspect-ratio:16/10; overflow:hidden;}
  .card-img img{width:100%; height:100%; object-fit:cover; display:block;}
  .card-emoji{position:absolute; top:10px; left:12px; font-size:40px;
    filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));}
  .card-body{padding:14px 18px 18px;}
  .card-title{font-family:var(--display); font-weight:800; font-size:clamp(22px,6vw,28px); margin:0; line-height:1.05;}
  .card-line{font-family:var(--body); font-weight:700; color:var(--ink-soft); font-size:16px; margin:6px 0 0;}
  .card-go{display:inline-block; margin-top:10px; font-family:var(--display); font-weight:800;
    color:#fff; font-size:15px; padding:7px 16px; border-radius:999px;}
  /* farvekanter pr. kort */
  .card.c-pool{box-shadow:0 12px 0 var(--pool-deep), 0 20px 30px rgba(15,140,176,.22);}
  .card.c-pool .card-title{color:var(--pool-deep);} .card.c-pool .card-go{background:var(--pool);}
  .card.c-coral{box-shadow:0 12px 0 var(--coral-deep), 0 20px 30px rgba(200,50,35,.22);}
  .card.c-coral .card-title{color:var(--coral-deep);} .card.c-coral .card-go{background:var(--coral);}
  .card.c-grass{box-shadow:0 12px 0 #2f9b50, 0 20px 30px rgba(30,130,70,.22);}
  .card.c-grass .card-title{color:#2f9b50;} .card.c-grass .card-go{background:var(--grass);}
  .card.c-grape{box-shadow:0 12px 0 #5a4cd6, 0 20px 30px rgba(80,70,200,.22);}
  .card.c-grape .card-title{color:#5a4cd6;} .card.c-grape .card-go{background:var(--grape);}
  .card.c-sun{box-shadow:0 12px 0 #e0a800, 0 20px 30px rgba(210,160,0,.22);}
  .card.c-sun .card-title{color:#d08a00;} .card.c-sun .card-go{background:var(--sun); color:#5a3b00;}
  .card.c-sky{box-shadow:0 12px 0 #1f8fc4, 0 20px 30px rgba(30,140,200,.22);}
  .card.c-sky .card-title{color:#1f8fc4;} .card.c-sky .card-go{background:var(--sky);}

  .ending{margin-top:26px; text-align:center; background:var(--sand); border-radius:26px;
    padding:20px 18px 24px; box-shadow:0 10px 0 #f0dfbc;}
  .ending img{width:100%; max-width:300px; border-radius:20px; border:5px solid #fff;
    box-shadow:0 10px 22px rgba(13,80,110,.25); margin-bottom:14px;}
  .ending h3{font-family:var(--display); font-weight:800; font-size:clamp(24px,7vw,32px);
    color:var(--coral-deep); margin:0 0 14px; line-height:1.05;}
  .replay{background:var(--pool); box-shadow:0 9px 0 var(--pool-deep), 0 16px 28px rgba(15,140,176,.35);}
  .replay:active{box-shadow:0 3px 0 var(--pool-deep);}

  /* ---------- fuldskærms-overlay ---------- */
  .overlay{position:fixed; inset:0; z-index:40; display:none; place-items:center;
    background:rgba(8,40,55,.86); backdrop-filter:blur(4px); padding:20px;}
  .overlay.show{display:grid; animation:fade .25s both;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .ov-inner{width:100%; max-width:460px; text-align:center; animation:popIn .35s both;}
  .ov-emoji{font-size:64px; line-height:1; filter:drop-shadow(0 6px 10px rgba(0,0,0,.4));}
  .ov-img{width:100%; aspect-ratio:3/2; object-fit:cover; border-radius:24px; border:6px solid #fff;
    box-shadow:0 18px 40px rgba(0,0,0,.5); margin:10px 0 14px;}
  .ov-title{font-family:var(--display); font-weight:800; color:#fff; font-size:clamp(26px,8vw,36px); margin:0 0 6px;}
  .ov-line{font-family:var(--body); font-weight:700; color:#e8fbff; font-size:clamp(17px,5vw,21px); margin:0 0 18px;}
  .ov-close{appearance:none; border:none; cursor:pointer; font-family:var(--display); font-weight:800;
    color:#0e3a4d; background:#fff; font-size:22px; padding:14px 34px; border-radius:999px;
    box-shadow:0 8px 0 #cfd9de;}
  .ov-close:active{transform:translateY(5px); box-shadow:0 3px 0 #cfd9de;}

  #confetti{position:fixed; inset:0; z-index:60; pointer-events:none;}

  :focus-visible{outline:4px solid #fff; outline-offset:3px; border-radius:14px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:.001s !important; animation-iteration-count:1 !important;}
    .cloud,.sun{display:none;}
  }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
</div>

<div id="app">
 <div class="wrap">

  <!-- SKÆRM 1 -->
  <section class="screen screen--surprise active" id="s1">
    <p class="eyebrow">En lille overraskelse 🤫</p>
    <h1 class="big-q" id="greet">Hvor skal vi hen<br>i sommer?</h1>
    <button class="box" id="openBox" aria-label="Åbn overraskelsen">
      <span class="bow">🎀</span>
      <span class="qmark">?</span>
    </button>
    <button class="cta" id="openBtn">TRYK HER 👆</button>
    <p class="tap-hint">Tryk på den røde kasse</p>

    title:"Find det hele!",
    line:"Sådan ser stedet ud helt oppefra. Kan du finde poolen, den orange hoppepude og minigolfen?" }
];

/* ---------- hjælpere ---------- */
const $ = s => document.querySelector(s);
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
}

/* ---------- hilsen + maskot-navn ---------- */
(function(){
  const navne = CONFIG.boern.filter(Boolean);
  let hej = "Hej med jer!";
  if(navne.length===1) hej = "Hej " + navne[0] + "!";
  else if(navne.length===2) hej = "Hej " + navne[0] + " og " + navne[1] + "!";
  else if(navne.length>2) hej = "Hej " + navne.slice(0,-1).join(", ") + " og " + navne.slice(-1) + "!";
  $("#greet").innerHTML = hej + "<br>Hvor skal vi hen i sommer?";
  $("#welcomeBadge").textContent = CONFIG.maskotNavn + " byder velkommen! 👋";
})();

/* ---------- nedtælling ---------- */
(function(){
  const t = new Date(CONFIG.ferieDato + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.round((t - now) / 86400000);
  const num = $("#cdNum"), lab = $("#cdLabel"), txt = $("#cdText");
  if(isNaN(t.getTime())){ num.textContent="🌞"; lab.textContent=""; txt.textContent="Snart på ferie!"; return; }
  if(days > 1){ num.textContent=days; lab.textContent= days===1?"DAG":"DAGE"; txt.textContent="til vi kører afsted! 🚗"; }
  else if(days === 1){ num.textContent="1"; lab.textContent="DAG"; txt.textContent="I morgen kører vi! 🚗"; }
  else if(days === 0){ num.textContent="🎉"; lab.textContent=""; txt.textContent="I DAG kører vi!! 🚗"; }
  else { num.textContent="🏖️"; lab.textContent=""; txt.textContent="Vi er på ferie — yes!"; }
})();

/* ---------- byg kort ---------- */
(function(){
  const wrap = $("#cards");
  ACTS.forEach(a=>{
    const b = document.createElement("button");
    b.className = "card " + a.color;
    b.innerHTML =
      '<div class="card-img"><span class="card-emoji">'+a.emoji+'</span>'+
      '<img src="'+a.img+'" alt="'+a.title+'"></div>'+
      '<div class="card-body"><h3 class="card-title">'+a.title+'</h3>'+
      '<p class="card-line">'+a.line+'</p>'+
      '<span class="card-go">Tryk og se ✨</span></div>';
    b.addEventListener("click", ()=>openOverlay(a));
    wrap.appendChild(b);
  });
})();

/* ---------- overlay ---------- */
function openOverlay(a){
  $("#ovEmoji").textContent = a.emoji;
  $("#ovImg").src = a.img;
  $("#ovImg").alt = a.title;
  $("#ovTitle").textContent = a.title;
  $("#ovLine").textContent = a.line;
  $("#overlay").classList.add("show");
}
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay" || e.target.id==="ovClose") $("#overlay").classList.remove("show"); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") $("#overlay").classList.remove("show"); });

/* ---------- navigation ---------- */
$("#openBox").addEventListener("click", reveal);
$("#openBtn").addEventListener("click", reveal);
function reveal(){ confetti(); setTimeout(()=>show("#s2"), 380); }
$("#toActivities").addEventListener("click", ()=>show("#s3"));
$("#replay").addEventListener("click", ()=>{ show("#s1"); });

/* ---------- konfetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr; ctx.scale(dpr,dpr);
  const cols = ["#ff5a48","#ffc637","#1fc1dc","#46c46a","#7b6cf6","#ffffff"];
  const N = 150, P = [];
  for(let i=0;i<N;i++){
    P.push({ x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*0.5,
      w:7+Math.random()*9, h:9+Math.random()*12, c:cols[i%cols.length],
      vy:2.4+Math.random()*3.4, vx:-1.6+Math.random()*3.2,
      rot:Math.random()*6.28, vr:-0.18+Math.random()*0.36 });
  }
  let t0=null;
  function frame(ts){
    if(!t0) t0=ts; const el=ts-t0;
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.045; p.rot+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.c; ctx.globalAlpha = el>2200 ? Math.max(0,1-(el-2200)/900) : 1;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore();
    });
    if(el<3100) requestAnimationFrame(frame);
    else ctx.clearRect(0,0,cv.width,cv.height);
  }
  requestAnimationFrame(frame);
}
</script>
